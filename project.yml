name: MacVitals
options:
  bundleIdPrefix: com.tylersimmons
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    # One stable identity for every build. macOS remembers privacy permissions (Full Disk Access,
    # Location, Automation…) by code signature; ad-hoc signing ("-") made every rebuild a "new app"
    # and silently dropped them.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: 7MGPA96634
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

targets:
  MacVitals:
    type: application
    platform: macOS
    sources:
      - path: MacVitals
        excludes:
          - Info.plist
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: MacVitals
        PRODUCT_BUNDLE_IDENTIFIER: com.tylersimmons.MacVitals
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated Info.plist: Sparkle's feed and public key.
        INFOPLIST_FILE: MacVitals/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mac Vitals
        # Menu bar app: starts without a Dock icon; DockIcon.swift shows it while a window is open.
        INFOPLIST_KEY_LSUIElement: YES
        # Shown in macOS's folder-access prompts. Plain language; sizes only, never contents.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Mac Vitals measures how much space your Documents folder uses. It only reads sizes, never file contents, and nothing leaves your Mac."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Mac Vitals measures how much space your Desktop uses. It only reads sizes, never file contents, and nothing leaves your Mac."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Mac Vitals measures your Downloads folder to find old installers and large files you might not need. Nothing leaves your Mac."
        # Wi-Fi network names count as location data in macOS. We never look up where you are.
        INFOPLIST_KEY_NSLocationUsageDescription: "macOS treats your Wi-Fi network's name as location data. Mac Vitals uses it only to show which network you're on. It never looks up where you are, and nothing leaves your Mac."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "macOS treats your Wi-Fi network's name as location data. Mac Vitals uses it only to show which network you're on. It never looks up where you are, and nothing leaves your Mac."
        # Finder moves items that belong to all users to the Trash (it asks for your password).
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Mac Vitals asks Finder to move protected items (like apps installed for all users) to the Trash. Finder asks for your password, and nothing is deleted until you empty the Trash."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Mac Vitals finds screenshots and near-identical photos in your library so you can clean them up. Photos are analyzed on this Mac and never leave it. Photos asks you to confirm anything deleted."
        CODE_SIGN_ENTITLEMENTS: MacVitals/MacVitals.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Tyler Simmons"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Not sandboxed: process inspection + cleanup require it (same as Vitals / CleanMyMac).
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # No debugger entitlement in Release (notarization rejects it).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - MacVitalsTests

  MacVitalsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacVitalsTests
    dependencies:
      - target: MacVitals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylersimmons.MacVitalsTests
        GENERATE_INFOPLIST_FILE: YES
