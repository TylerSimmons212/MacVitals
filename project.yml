name: MacVitals
options:
  bundleIdPrefix: com.tylersimmons
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MacVitals:
    type: application
    platform: macOS
    sources:
      - path: MacVitals
    settings:
      base:
        PRODUCT_NAME: MacVitals
        PRODUCT_BUNDLE_IDENTIFIER: com.tylersimmons.MacVitals
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mac Vitals
        # Menu bar app: starts without a Dock icon; DockIcon.swift shows it while a window is open.
        INFOPLIST_KEY_LSUIElement: YES
        # Shown in macOS's folder-access prompts. Plain language; sizes only, never contents.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Mac Vitals measures how much space your Documents folder uses. It only reads sizes, never file contents, and nothing leaves your Mac."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Mac Vitals measures how much space your Desktop uses. It only reads sizes, never file contents, and nothing leaves your Mac."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Mac Vitals measures your Downloads folder to find old installers and large files you might not need. Nothing leaves your Mac."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Tyler Simmons"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Not sandboxed: process inspection + cleanup require it (same as Vitals / CleanMyMac).
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - MacVitalsTests

  MacVitalsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacVitalsTests
    dependencies:
      - target: MacVitals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylersimmons.MacVitalsTests
        GENERATE_INFOPLIST_FILE: YES
